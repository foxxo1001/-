# Cloudflare Worker 部署配置
# main 告诉 wrangler：入口文件是 cloudflare/worker.js
# name 是 Worker 的名字——如果你在 Cloudflare 面板建 Worker 时用了别的名字，
# 把下面这行改成和面板一致（面板 Worker 页面的标题就是名字）
name = "chat-proxy"
main = "cloudflare/worker.js"
compatibility_date = "2024-07-01"

# 模型接口配置（非密钥部分；LLM_API_KEY 用 secret 存，不进仓库）
[vars]
LLM_API_URL = "https://opencode.ai/zen/v1/chat/completions"
LLM_MODEL = "hy3-free"
